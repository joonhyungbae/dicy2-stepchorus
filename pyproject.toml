[project]
name = "dicy2-stepchorus"
version = "0.1.0"
description = "관객의 걸음이 긴 소리로 쌓여 합주가 된다"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "soundfile>=0.12",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=12",
  "python-osc>=1.8",
]

[project.optional-dependencies]
speaker = ["sounddevice>=0.4"]
camera = ["mediapipe>=0.10", "opencv-python>=4.9"]

[tool.setuptools]
packages = ["stepchorus"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
